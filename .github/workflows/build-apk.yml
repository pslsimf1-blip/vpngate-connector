name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (without submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git and clone submodules via HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
          echo "=== SoftEtherClient содержимое ==="
          ls -la SoftEtherClient/
          echo "=== openssl подмодуль ==="
          ls -la SoftEtherClient/src/main/cpp/openssl/include/openssl/ | head -20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "vn.unlimit.vpngate"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildPurposesOnly000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Fix OpenSSL configuration.h
        run: |
          OPENSSL_INC="SoftEtherClient/src/main/cpp/openssl/include/openssl"
          if [ ! -f "$OPENSSL_INC/configuration.h" ]; then
            cat > "$OPENSSL_INC/configuration.h" << 'EOF'
          #ifndef OSSL_CONFIGURATION_H
          # define OSSL_CONFIGURATION_H
          # pragma once

          # define OPENSSL_API_COMPAT 0x30000000L
          # define OPENSSL_CONFIGURED_API 30000L
          # define OPENSSL_NO_DEPRECATED

          # define SIXTY_FOUR_BIT_LONG
          # define RC4_INT unsigned int

          #endif
          EOF
          fi
          echo "=== Список файлов OpenSSL include ==="
          ls -la "$OPENSSL_INC/" | head -30

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
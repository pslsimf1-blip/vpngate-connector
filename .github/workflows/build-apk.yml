name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (without submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git and clone submodules via HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
          echo "=== Подмодули скачаны ==="
          ls SoftEtherClient/src/main/cpp/openssl/ | head
          echo "=== Файлы в openssl/include/openssl ==="
          ls SoftEtherClient/src/main/cpp/openssl/include/openssl/ | head -20 || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Perl (needed by OpenSSL Configure)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq perl

      - name: Inspect ABI configuration (diagnostic)
        run: |
          echo "=== app/build.gradle abiFilters ==="
          grep -B2 -A10 "abiFilters" app/build.gradle* 2>/dev/null || echo "нет abiFilters в app/"
          echo "=== SoftEtherClient/build.gradle abiFilters ==="
          grep -B2 -A10 "abiFilters" SoftEtherClient/build.gradle* 2>/dev/null || echo "нет abiFilters в SoftEtherClient/"

      - name: Build OpenSSL for ARM ABIs
        run: |
          set -e
          export ANDROID_NDK_ROOT=$(ls -d /usr/local/lib/android/sdk/ndk/*/ | head -1 | sed 's:/$::')
          echo "NDK: $ANDROID_NDK_ROOT"
          export ANDROID_API=23
          cd SoftEtherClient/src/main/cpp
          chmod +x build-openssl-android.sh
          # Собираем только ARM-архитектуры — они нужны для реальных телефонов.
          # x86 нужны только эмуляторам; если понадобятся — добавим позже.
          ./build-openssl-android.sh arm64-v8a
          ./build-openssl-android.sh armeabi-v7a
          echo "=== Итог: библиотеки в jniLibs ==="
          ls -la ../jniLibs/arm64-v8a/ || true
          ls -la ../jniLibs/armeabi-v7a/ || true
          echo "=== Итог: заголовки OpenSSL ==="
          ls openssl/include/openssl/ | grep -E "opensslv|configuration|safestack" || true

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "vn.unlimit.vpngate"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildPurposesOnly000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
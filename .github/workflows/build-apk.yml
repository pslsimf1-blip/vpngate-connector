name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (without submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git and clone submodules via HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
          echo "=== Диагностика OpenSSL include ==="
          OPENSSL_INC="SoftEtherClient/src/main/cpp/openssl/include/openssl"
          ls -la "$OPENSSL_INC/" | grep -E "opensslv|macros|aes|evp" || true
          echo "=== Ищу opensslv.h.in ==="
          find "SoftEtherClient/src/main/cpp/openssl" -name "opensslv*" -type f 2>/dev/null || true
          echo "=== Корень openssl ==="
          ls -la "SoftEtherClient/src/main/cpp/openssl/" 2>/dev/null || echo "папка не найдена"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "vn.unlimit.vpngate"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildPurposesOnly000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Fix OpenSSL headers (configuration.h + opensslv.h)
        run: |
          OPENSSL_INC="SoftEtherClient/src/main/cpp/openssl/include/openssl"

          # configuration.h
          if [ ! -f "$OPENSSL_INC/configuration.h" ]; then
            cat > "$OPENSSL_INC/configuration.h" << 'EOF'
          #ifndef OSSL_CONFIGURATION_H
          # define OSSL_CONFIGURATION_H
          # pragma once

          # define OPENSSL_API_COMPAT 0x30000000L
          # define OPENSSL_CONFIGURED_API 30000L
          # define OPENSSL_NO_DEPRECATED

          # define SIXTY_FOUR_BIT_LONG
          # define RC4_INT unsigned int

          #endif
          EOF
            echo "Создан configuration.h"
          fi

          # opensslv.h — заглушка версии
          if [ ! -f "$OPENSSL_INC/opensslv.h" ]; then
            # Если есть шаблон opensslv.h.in, копируем его
            if [ -f "$OPENSSL_INC/opensslv.h.in" ]; then
              cp "$OPENSSL_INC/opensslv.h.in" "$OPENSSL_INC/opensslv.h"
              echo "Скопирован opensslv.h из шаблона"
            else
              # Иначе создаём минимальную заглушку
              cat > "$OPENSSL_INC/opensslv.h" << 'EOF'
          #ifndef HEADER_OPENSSLV_H
          # define HEADER_OPENSSLV_H

          # define OPENSSL_VERSION_NUMBER 0x30000000L
          # define OPENSSL_VERSION_TEXT "OpenSSL 3.0.0 (stub for Android build)"
          # define OPENSSL_VERSION_MAJOR 3
          # define OPENSSL_VERSION_MINOR 0
          # define OPENSSL_VERSION_PATCH 0

          # define OPENSSL_FULL_VERSION_STR "3.0.0"
          # define OPENSSL_VERSION_PRE_RELEASE ""
          # define OPENSSL_VERSION_BUILD_METADATA ""

          # define OPENSSL_VERSION_STR "3.0.0"
          # define OPENSSL_FULL_VERSION_STR "3.0.0"

          #endif
          EOF
              echo "Создан opensslv.h (заглушка)"
            fi
          fi

          echo "=== Итог ==="
          ls -la "$OPENSSL_INC/" | grep -E "opensslv|configuration"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk